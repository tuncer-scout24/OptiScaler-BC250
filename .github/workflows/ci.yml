name: Build and package

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Build and package
        run: ./scripts/build.ps1

      - name: Upload package and checksum
        uses: actions/upload-artifact@v7.0.0
        with:
          name: OptiScaler-BC250-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: msbuild-log-${{ github.sha }}
          path: build.binlog
          if-no-files-found: warn
          retention-days: 7
