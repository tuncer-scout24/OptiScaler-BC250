name: Build and package

on:
  push:
    branches: ['**']
    tags: ['bc250-alpha.*', 'v*-beta.*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-removal:
    name: Linux removal checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test generated Linux remover and setup
        run: python3 tests/test_uninstall.py

  build:
    name: Release x64
    needs: linux-removal
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      artifact-ids: ${{ steps.package.outputs.artifact-id }},${{ steps.checksum.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and dependencies
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Visual Studio 2022 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[17.0,18.0)'
          msbuild-architecture: x64

      - name: Build and package
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: ./scripts/build.ps1 -ReleaseTag $env:RELEASE_TAG

      - name: Test generated Windows remover
        env:
          OPTISCALER_TEST_DLL: ${{ github.workspace }}/x64/Release/a/OptiScaler.dll
        run: python tests/test_uninstall.py

      - name: Upload directly usable ZIP
        id: package
        uses: actions/upload-artifact@v7.0.0
        with:
          path: artifacts/*.zip
          archive: false
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload checksum
        id: checksum
        uses: actions/upload-artifact@v7.0.0
        with:
          path: artifacts/*.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.0
        with:
          name: msbuild-log-${{ github.sha }}
          path: build.binlog
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish BC250 prerelease
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/bc250-alpha.') || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-beta.')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the exact build outputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-ids }}
          merge-multiple: true
          skip-decompress: true
          path: artifacts

      - name: Verify ZIP and checksum
        id: verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" =~ ^bc250-alpha\.[0-9]+$ ]]; then
            alpha_number="${RELEASE_TAG#bc250-alpha.}"
            archive="OptiScaler_BC250_Alpha${alpha_number}.zip"
            release_name="OptiScaler BC250 Alpha $alpha_number"
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            archive="OptiScaler_BC250_${RELEASE_TAG}.zip"
            release_name="OptiScaler BC250 $RELEASE_TAG"
          else
            echo "Unsupported prerelease tag: $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum --check "$archive.sha256"
          unzip -tq "$archive"
          python3 - "$archive" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as package:
              names = set(package.namelist())
              required = {
                  "OptiScaler.dll", "OptiScaler.ini", "setup_linux.sh", "setup_windows.bat",
                  "OptiScaler/amdvkffx64.dll", "OptiScaler/amdxcffx64.dll",
              }
              if not required <= names:
                  raise SystemExit(f"Missing runtime files: {sorted(required - names)}")
              if any(name.lower().endswith((".zip", ".7z")) for name in names):
                  raise SystemExit("Nested archive found in runtime ZIP")
          PY
          echo "release-name=$release_name — unofficial build" >> "$GITHUB_OUTPUT"

      - name: Publish build outputs as a prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.verify.outputs.release-name }}
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            artifacts/OptiScaler_BC250_*.zip
            artifacts/OptiScaler_BC250_*.zip.sha256
          body: |
            Unofficial BC250 build of [OptiScaler](https://github.com/optiscaler/OptiScaler),
            developed by the upstream OptiScaler team and contributors. Thank you for making OptiScaler available.
            This independently maintained fork contributes limited BC250 compatibility, configuration,
            and packaging changes. The bundled provider DLLs are supplied, unchanged AMD binaries.
            Please report issues with these builds in this repository.

            BC250 prerelease with GPU recognition, FSR 4 INT8 configuration, bundled AMD x64 providers,
            and complete removal of the packaged runtime, profile, and documentation.

            Download the runtime ZIP below and extract it once into the game executable folder.
            It contains OptiScaler.dll, OptiScaler.ini, setup scripts, and the OptiScaler runtime directory,
            including amdxcffx64.dll and amdvkffx64.dll (file version 2.4.0.4370).
            There is no nested archive. The release ZIP and checksum are the exact build artifacts.

            The optional profiles/BC250.ini selects FSR 4 INT8; back up an existing INI before using it.
            A compatible BC250 RADV/Proton stack is still required. Builds are unsigned.
            The maintainer reports successful testing on BC250. Automated Linux and Windows removal checks run before publishing.

            Source commit: ${{ github.sha }}
            Build: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
