; AMD BC-250 / GFX1013 (1002:13FE), for Linux/Proton with a compatible RADV stack.
; Copy to the game folder as OptiScaler.ini, or merge into your existing INI.
; FSR 4 provider DLLs are bundled in OptiScaler/; see docs/BC250.md.

[Upscalers]
Dx12Upscaler=ffx

[FSR]
UpscalerIndex=0
; Fsr4GpuSupport: 2 = INT8 capability override.
Fsr4GpuSupport=2
; Fsr4Model: 1 = INT8 model (different numbering from Fsr4GpuSupport).
Fsr4Model=1

[FrameGen]
Enabled=false

[Log]
LogToFile=true
LogLevel=2
